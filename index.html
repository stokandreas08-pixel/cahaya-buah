    <script>
      (function() {
        try {
          var _currentFetch = window.fetch;
          Object.defineProperty(window, 'fetch', {
            get: function() {
              return _currentFetch;
            },
            set: function(val) {
              _currentFetch = val;
            },
            configurable: true,
            enumerable: true
          });
        } catch (e) {
          try {
            if (typeof Window !== 'undefined' && Window.prototype) {
              var _protoFetch = Window.prototype.fetch;
              Object.defineProperty(Window.prototype, 'fetch', {
                get: function() {
                  return _protoFetch;
                },
                set: function(val) {
                  _protoFetch = val;
                },
                configurable: true,
                enumerable: true
              });
            }
          } catch (e2) {}
        }

        // Suppress benign iframe/preview injection error if it occurs
        window.addEventListener('error', function(event) {
          if (event && event.message && event.message.indexOf('fetch') !== -1 && event.message.indexOf('getter') !== -1) {
            event.preventDefault();
            event.stopImmediatePropagation();
          }
        }, true);
      })();
    </script>
